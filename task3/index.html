<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Список задач</h1>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="Что нужно сделать?">
      <button type="submit">Добавить</button>
    </form>

    <p id="warning"></p>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="done">Завершённые</button>
    </div>

    <ul id="task-list"></ul>

    <p id="counter"></p>
  </main>
</body>
</html>
